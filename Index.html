<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Cali - Catálogo Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVEGACIÓN Y CABECERA -->
  <header class="header">
    <div class="header-container">
      <a href="#" class="brand">
        <img src="Nexus_Imagenes/Logo.jpg" alt="Nexus Cali Logo" class="brand-logo">
        <span class="brand-name">NEXUS CALI</span>
      </a>

      <form id="searchForm" class="search-form" action="#" role="search">
        <input 
          type="search" 
          id="searchInput" 
          class="search-input" 
          placeholder="Buscar categorías o productos..."
          aria-label="Buscar en el catálogo"
        >
        <button type="submit" class="search-button">Buscar</button>
      </form>
    </div>
  </header>

  <!-- BANNER INFORMATIVO / BIENVENIDA -->
  <section id="infoBanner" class="info-banner">
    <div class="banner-container">
      <h1>Bienvenido a Nexus Cali</h1>
      <p>Explora nuestro catálogo de tecnología, periféricos, componentes y servicios técnicos.</p>
    </div>
  </section>

  <!-- SECCIÓN PRINCIPAL DEL CATÁLOGO -->
  <main id="catalogSection" class="catalog-section">
    <div class="catalog-header">
      <h2 id="catalogTitle">CATÁLOGO</h2>
      <div class="catalog-meta">
        <span id="catalogCount">10 categorías</span>
        <span id="searchStatus" class="search-status"></span>
      </div>
    </div>

    <!-- CONTENEDOR DINÁMICO (CATEGORÍAS Y SUBCATEGORÍAS) -->
    <div id="catalog" class="catalog-grid"></div>
  </main>

  <!-- PIE DE PÁGINA / CONTACTO -->
  <footer id="contacto" class="footer">
    <div class="footer-container">
      <div class="footer-info">
        <h3>Nexus Cali</h3>
        <p>Asesoría en tecnología, hardware y servicios técnicos en Cali.</p>
      </div>
      <div class="footer-actions">
        <button type="button" id="footerWhatsapp" class="whatsapp-button">
          Contactar por WhatsApp
        </button>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
